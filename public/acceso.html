<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso negocios — Timely</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FAF7F1; --surface:#FFFFFF; --ink:#1B2430; --brass:#BD9552; --text:#2A2A28; --muted:#8A8577; --line:#E7E1D6; --rust:#B5533C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 40px 16px; }
  .card { width: 100%; max-width: 380px; background: var(--surface); border-radius: 14px; padding: 32px; border: 1px solid var(--line); height: fit-content; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 24px; }
  .field-label { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; font-family: 'Inter', sans-serif; background: #FCFAF6; color: var(--text); }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .btn { width: 100%; background: var(--ink); color: #F7F1E4; border: none; padding: 12px 0; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 18px; }
  .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">✂️ Timely</div>
  <div class="sub">Accede al panel de tu negocio</div>
  <div class="field-label">Identificador de tu negocio</div>
  <input id="slugInput" placeholder="ej. barberia-central" onkeydown="if(event.key==='Enter')goToPanel()">
  <div class="hint">Es la parte de tu URL después de "?negocio=". Te lo dimos al registrarte.</div>
  <button class="btn" onclick="goToPanel()">Ir a mi panel</button>
  <a href="/registro.html" class="back">¿Aún no tienes negocio registrado? Créalo aquí</a>
</div>
<script>
function goToPanel() {
  const slug = document.getElementById('slugInput').value.trim();
  if (!slug) return;
  location.href = '/admin.html?negocio=' + encodeURIComponent(slug);
}
</script>
</body>
</html>
